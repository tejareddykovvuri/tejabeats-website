<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#spotlight)"/>

  <!-- Sound wave decoration -->
  <g fill="url(#glow)" opacity="0.7">
    <rect x="460" y="300" width="18" height="120" rx="9"/>
    <rect x="495" y="260" width="18" height="200" rx="9"/>
    <rect x="530" y="320" width="18" height="80" rx="9"/>
    <rect x="565" y="240" width="18" height="240" rx="9"/>
    <rect x="600" y="280" width="18" height="160" rx="9"/>
    <rect x="635" y="220" width="18" height="280" rx="9"/>
    <rect x="670" y="300" width="18" height="120" rx="9"/>
    <rect x="705" y="260" width="18" height="200" rx="9"/>
    <rect x="740" y="330" width="18" height="60" rx="9"/>
  </g>

  <text x="600" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle">TejaBeats</text>
  <text x="600" y="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#a78bfa" text-anchor="middle">Download for Android, iPhone &amp; Windows</text>
</svg>
