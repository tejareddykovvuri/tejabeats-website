<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bg)"/>

  <!-- Outer ring -->
  <rect x="22" y="22" width="156" height="156" rx="36" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.6"/>

  <!-- Sound wave bars -->
  <g fill="url(#glow)" opacity="0.9">
    <rect x="54" y="100" width="12" height="42" rx="6">
      <animate attributeName="height" values="42;62;38;52;42" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="100;90;102;96;100" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="78" y="80" width="12" height="82" rx="6">
      <animate attributeName="height" values="82;58;92;70;82" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;92;76;86;80" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="102" y="94" width="12" height="54" rx="6">
      <animate attributeName="height" values="54;78;48;66;54" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="94;82;98;88;94" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="126" y="72" width="12" height="98" rx="6">
      <animate attributeName="height" values="98;66;104;80;98" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="72;88;68;82;72" dur="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Center T monogram -->
  <text x="100" y="128" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">T</text>
</svg>
